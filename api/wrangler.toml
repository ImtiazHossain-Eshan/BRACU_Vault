name = "bracu-vault-api"
main = "src/index.ts"
compatibility_date = "2025-01-15"

# ── D1 (SQLite) ───────────────────────────────────────────────────────────────
# Create with:  wrangler d1 create bracu_vault   → paste the returned id below.

[[d1_databases]]
binding = "bracu_vault"
database_name = "bracu_vault"
database_id = "b3e04cf3-112d-433c-a28e-e9b2f7a434dd"


# ── R2 (uploads) ──────────────────────────────────────────────────────────────
# Create with:  wrangler r2 bucket create bracu-vault-uploads

[[r2_buckets]]
bucket_name = "bracu-vault-uploads"
binding = "bracu_vault_uploads"

# Public archive bucket (files.bracuvault.me) — approved community uploads land here.
[[r2_buckets]]
bucket_name = "bracu-vault-files"
binding = "bracu_vault_files"


# ── Non-secret config (editable; mirrored into the DB `settings` table later) ──
[vars]
ENVIRONMENT = "development"
ALLOWED_EMAIL_DOMAINS = "g.bracu.ac.bd"
SITE_URL = "https://bracuvault.me"
# Clerk publishable key is public (safe to commit). Paste yours (pk_live_… / pk_test_…).
CLERK_PUBLISHABLE_KEY = "pk_test_cGVhY2VmdWwtbWFydGluLTMwLmNsZXJrLmFjY291bnRzLmRldiQ"

# Secrets are NOT stored here. Set them with `wrangler secret put <NAME>`:
#   ROSTER_HMAC_SECRET   CLERK_SECRET_KEY   RESEND_API_KEY   TURNSTILE_SECRET
# For local dev, put them in .dev.vars (gitignored) — see .dev.vars.example.

# ── Production (deployed to api.bracuvault.me) ────────────────────────────────
# Deploy with:  wrangler deploy --env production
# Set the live secret:  wrangler secret put CLERK_SECRET_KEY --env production
[env.production]
routes = [{ pattern = "api.bracuvault.me", custom_domain = true }]

[[env.production.d1_databases]]
binding = "bracu_vault"
database_name = "bracu_vault"
database_id = "b3e04cf3-112d-433c-a28e-e9b2f7a434dd"

[[env.production.r2_buckets]]
binding = "bracu_vault_uploads"
bucket_name = "bracu-vault-uploads"

[[env.production.r2_buckets]]
binding = "bracu_vault_files"
bucket_name = "bracu-vault-files"

[env.production.vars]
ENVIRONMENT = "production"
ALLOWED_EMAIL_DOMAINS = "g.bracu.ac.bd"
SITE_URL = "https://bracuvault.me"
CLERK_PUBLISHABLE_KEY = "pk_live_Y2xlcmsuYnJhY3V2YXVsdC5tZSQ"
