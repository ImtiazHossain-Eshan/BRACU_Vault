<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline - BRACU Vault</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid; place-items: center; padding: 24px;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: radial-gradient(circle at 50% 30%, #1a1a1c, #0f0f10 70%);
        color: #e8e1d9; text-align: center;
      }
      .card { max-width: 22rem; }
      .mark {
        width: 64px; height: 64px; margin: 0 auto 22px;
        border-radius: 18px;
        background: linear-gradient(135deg, #c17a2b, #8b6f47 55%, #3a2e22);
        display: grid; place-items: center;
        box-shadow: 0 18px 50px -20px rgba(193, 122, 43, 0.6);
      }
      h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { font-size: 0.95rem; line-height: 1.6; color: rgba(232, 225, 217, 0.6); margin: 0 0 24px; }
      button {
        appearance: none; border: 0; cursor: pointer;
        background: #e8e1d9; color: #0f0f10;
        font-size: 0.9rem; font-weight: 600;
        padding: 12px 24px; border-radius: 999px;
        transition: transform 0.15s ease;
      }
      button:active { transform: scale(0.96); }
      .hint { margin-top: 18px; font-size: 0.75rem; color: rgba(232, 225, 217, 0.35); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">
        <svg width="34" height="34" viewBox="0 0 48 48" fill="none" stroke="#F8F5F0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M24 9 L37 16.5 L37 31.5 L24 39 L11 31.5 L11 16.5 Z" />
          <path d="M16 20 L24 29 L32 20" />
          <circle cx="24" cy="29" r="2.6" fill="#F8F5F0" stroke="none" />
        </svg>
      </div>
      <h1>You're offline</h1>
      <p>BRACU Vault can't reach the network right now. Files you've already opened are still available - reconnect to browse everything.</p>
      <button onclick="location.reload()">Try again</button>
      <div class="hint">Your saved &amp; recently opened material works offline.</div>
    </div>
  </body>
</html>
